name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Update official data]
    types: [completed]
  schedule:
    - cron: '17 * * * *' # hourly probe; rebuilds only when vacancies or the AEWV snapshot changed
  workflow_dispatch:

permissions:
  contents: write # commits the vacancy archive (data/archive/)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Scheduled runs only: compare upstream sources with what the live site was built from.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - id: pages
        uses: actions/configure-pages@v5
      - id: probe
        run: node scripts/check-updates.mjs "${{ steps.pages.outputs.base_url }}"

  build:
    needs: check
    if: >-
      always() &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'schedule' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Full accredited-employer snapshot (checksum-verified). On failure the job stops and the live site keeps the last good build.
      - run: node scripts/fetch-aewv.mjs
      # Current Education Gazette vacancies (listing facts only); failure stops the deploy, live site keeps last build.
      - run: node scripts/fetch-jobs.mjs
      - id: pages
        uses: actions/configure-pages@v5
      # Builds enrichments / geo groups / AEWV matches / jobs + feeds; fails (and blocks publishing) on invalid admin data.
      - run: node scripts/build-overlays.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Keep past vacancies: the archive is committed so it survives across builds. Pushes made with GITHUB_TOKEN
      # do not trigger workflows, so this cannot loop.
      - name: Commit vacancy archive
        run: |
          if git diff --quiet -- data/archive; then
            echo "Archive unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git commit -m "data: vacancy archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

  deploy:
    needs: build
    # always(): otherwise the skipped `check` job (non-scheduled runs) cascades and skips this job too.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
