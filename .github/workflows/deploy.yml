name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Update official data]
    types: [completed]
  schedule:
    - cron: '0 18 * * *' # daily: picks up new AEWV snapshots (published ~every 3 days)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Full accredited-employer snapshot (checksum-verified). On failure the job stops and the live site keeps the last good build.
      - run: node scripts/fetch-aewv.mjs
      # Builds enrichments / geo groups / AEWV matches; fails (and blocks publishing) on invalid admin data.
      - run: node scripts/build-overlays.mjs
      - run: npm run build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
