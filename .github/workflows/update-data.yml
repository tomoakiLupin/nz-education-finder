name: Update official data

on:
  schedule:
    - cron: '0 18 * * 1' # weekly, Tuesday 06:00/07:00 Auckland time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails without touching the committed snapshot if the source is unreachable or the batch looks broken.
      - run: node scripts/import-directories.mjs
      - name: Commit new batch
        run: |
          if git diff --quiet -- public/data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: import official School/ECE directories $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
